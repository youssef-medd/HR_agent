name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # weekly dependency audit (Mon 06:00 UTC) — spec §7

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Typecheck (mypy)
        run: mypy app

      - name: Tests (pytest)
        run: pytest

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt

      # The worker shares the api image's dependencies and imports `app.*`.
      - name: Install deps
        run: pip install -r api/requirements.txt

      - name: Lint (ruff)
        working-directory: worker
        run: ruff check orchestrator

      - name: Tests (pytest)
        working-directory: worker
        env:
          PYTHONPATH: ${{ github.workspace }}/api
        run: python -m pytest

      # §5.4 / §7 — the scoring + bias probe must stay green in CI.
      - name: Bias + scoring eval (bias probe)
        working-directory: worker
        env:
          PYTHONPATH: ${{ github.workspace }}/api
          EVALS_GOLDEN: ${{ github.workspace }}/evals/golden/fixtures.json
          EVALS_REPORTS: ${{ runner.temp }}/eval-reports
        run: python -m orchestrator.evals --stub

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npx eslint src

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Weekly dependency vulnerability audit (spec §7). Reports without blocking
      # the build so a new advisory surfaces but does not gate an unrelated PR.
      - name: pip-audit
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r api/requirements.txt
